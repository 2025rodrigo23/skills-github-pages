<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Formulario de Contacto</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background-color: #f2f2f2;
        }

        form {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            max-width: 400px;
            margin: auto;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #218838;
        }

        .error {
            color: red;
            font-size: 0.9em;
        }
    </style>
</head>

<body>

    <form action="https://formsubmit.co/apad23rothers@gmail.com" method="POST">
        <input type="text" name="nombre" required placeholder="Nombre">
        <input type="email" name="correo" required placeholder="Correo">
        <textarea name="mensaje" required placeholder="Mensaje"></textarea>
        <button type="submit">Enviar</button>
    </form>


    <script>
        document.getElementById("contactForm").addEventListener("submit", function (event) {
            event.preventDefault(); // Previene el envío real del formulario

            const nombre = document.getElementById("nombre").value.trim();
            const correo = document.getElementById("correo").value.trim();
            const mensaje = document.getElementById("mensaje").value.trim();
            const errorMsg = document.getElementById("errorMsg");

            errorMsg.textContent = ""; // Reinicia mensaje de error

            // Validación simple
            if (!nombre || !correo || !mensaje) {
                errorMsg.textContent = "Por favor completa todos los campos.";
                return;
            }

            const correoRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!correoRegex.test(correo)) {
                errorMsg.textContent = "El correo electrónico no es válido.";
                return;
            }

            // Aquí puedes manejar el envío con AJAX o mostrar mensaje
            alert("Formulario enviado con éxito!");
            this.reset(); // Limpia el formulario
        });
    </script>

</body>

</html>
